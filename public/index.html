    <script>
      /* Set the theme before first paint (AM light, PM dark, unless overridden). Mirrors src/theme.js. */
      (function () {
        var theme = new Date().getHours() < 12 ? "light" : "dark";
        try {
          var saved = JSON.parse(localStorage.getItem("theme-override"));
          if (saved && saved.until > Date.now() && (saved.theme === "light" || saved.theme === "dark")) {
            theme = saved.theme;
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
